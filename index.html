<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Java1</title>
</head>
<body>
    <label>numri 1</label>
    <input type="number" id="nr1">
    <br>

    <label>numri 2</label>
    <input type="number" id="nr2">
    <br>

    <button type="button" onclick="sum()">+</button>
    <button type="button" onclick="lum()">-</button>
    <button type="button" onclick="times()">*</button>
    <button type="button" onclick="ded()">/</button>
    <p id="result"></p>

    
    <br>
    <hr>
    <h1>Rritja dhe zbrijta e nje nurmi</h1>
    <p id=numri>0</p>
    
    <button type="submit" onlick="rritje">++</button>
    <button type="submit" onlick="zbritje">--</button>
    
    <script>
        
          var n = 0;

        function rritje()
        {
            n = n + 1;
            document.getElementById('numri').innerHTML = n;
        }

        function zbritje()
        {
            n = n - 1;
            document.getElementById('numri').innerHTML = n;
        }



        
        function sum()
        {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a + b;
            document.getElementById('result').innerHTML = c;
        }

        function lum()
        {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a - b;
            document.getElementById('result').innerHTML = c;
        }
         function times()
        {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            var c = a * b;
            document.getElementById('result').innerHTML = c;
        }
          function ded()
        {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
            if (b==0)
            {
                document.getElementById('result').innerHTML = 'Nuk pjestohet me 0';
            }
            else 
            {
            var c = a / b;
            document.getElementById('result').innerHTML = c;
            }
        }
    </script>
</body>
</html>
